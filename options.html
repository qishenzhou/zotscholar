<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ZotScholar · Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #1a1a2e;
      background: #f8f9fc;
      padding: 32px;
      max-width: 560px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .logo { font-size: 32px; }
    h1 { font-size: 18px; font-weight: 700; }
    .subtitle { font-size: 12px; color: #6b7280; margin-top: 3px; }

    section {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f3f4f6;
    }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 5px;
    }
    .optional { font-weight: 400; color: #9ca3af; }
    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background: white;
      color: #111827;
      outline: none;
    }
    input:focus { border-color: #1a1a6e; box-shadow: 0 0 0 2px rgba(26,26,110,0.12); }

    .hint {
      font-size: 11px;
      color: #6b7280;
      margin-top: 5px;
      line-height: 1.5;
    }
    .hint a { color: #1a1a6e; }

    button {
      padding: 7px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: white;
      color: #374151;
      white-space: nowrap;
      transition: background 0.15s;
    }
    button:hover { background: #f3f4f6; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: #1a1a6e;
      color: white;
      border-color: #1a1a6e;
      padding: 9px 24px;
      font-size: 13px;
    }
    .btn-primary:hover { background: #14146e; opacity: 0.9; }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 14px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.ok { background: #16a34a; }
    .dot.error { background: #dc2626; }
    .dot.unknown { background: #9ca3af; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }

    .msg { font-size: 12px; margin-top: 6px; }
    .msg.ok { color: #16a34a; }
    .msg.error { color: #b91c1c; }
    .hidden { display: none !important; }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 4px;
    }
    #save-status { font-size: 12px; }
    #save-status.ok { color: #16a34a; }
    #save-status.error { color: #b91c1c; }
  </style>
</head>
<body>

  <header>
    <img src="icon48.png" class="logo" alt="ZotScholar" width="36" height="36" style="border-radius:8px;">
    <div>
      <h1>ZotScholar</h1>
      <p class="subtitle">Settings — stored locally in your browser</p>
    </div>
  </header>

  <!-- Zotero -->
  <section>
    <h2>Zotero</h2>
    <div class="field">
      <label for="zotero-id">Library ID</label>
      <input type="text" id="zotero-id" placeholder="e.g. 1234567" />
      <p class="hint">
        <a href="https://www.zotero.org/settings/security" target="_blank">zotero.org → Account → Settings → Security</a>
        — shown as "Your userID for API"
      </p>
    </div>
    <div class="field">
      <label for="zotero-key">API Key</label>
      <div class="input-row">
        <input type="password" id="zotero-key" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxx" />
        <button id="btn-test-zotero">Test</button>
      </div>
      <p class="hint">Same page → <b>Create new private key</b> (read-only is enough)</p>
    </div>
    <div id="zotero-status" class="msg hidden"></div>
  </section>

  <!-- Semantic Scholar -->
  <section>
    <h2>Semantic Scholar</h2>
    <div class="status-line">
      <span class="dot unknown" id="s2-dot"></span>
      <span id="s2-login-text">Checking login status…</span>
    </div>
    <div class="field">
      <label for="s2-key">API Key <span class="optional">(optional — for faster lookups)</span></label>
      <div class="input-row">
        <input type="password" id="s2-key" placeholder="Get a free key at the S2 API portal" />
        <button id="btn-test-s2-key">Test</button>
      </div>
    </div>
    <div id="s2-key-status" class="msg hidden"></div>
  </section>

  <div class="actions">
    <button class="btn-primary" id="btn-save">Save Settings</button>
    <span id="save-status" class="hidden"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
